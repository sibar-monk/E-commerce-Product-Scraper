<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Book Market Research{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="wrap">
            <a class="brand" href="{{ url_for('catalog') }}">Book Market Research</a>
            <a class="button" href="{{ url_for('product_form') }}">Add product</a>
        </nav>
    </header>
    <main class="wrap">
        {% for message in get_flashed_messages() %}
            <p class="notice" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
